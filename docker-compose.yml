name: heritagegraph

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - ./models/qwen-fused.gguf:/models/qwen-fused.gguf:ro
    command:
      - --model
      - /models/qwen-fused.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --n-gpu-layers
      - ${LLAMA_GPU_LAYERS:-0}
    networks:
      - heritage-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      INFERENCE_BACKEND: llama_server
      LLAMA_SERVER_URL: http://llm:8080
      LLAMA_SERVER_TIMEOUT: ${LLAMA_SERVER_TIMEOUT:-300}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - llm
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - heritage-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - heritage-network

networks:
  heritage-network:
    driver: bridge
