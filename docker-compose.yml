services:

  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: heritagegraph-postgres
    environment:
      POSTGRES_DB: heritagegraph
      POSTGRES_USER: heritagegraph
      POSTGRES_PASSWORD: heritagegraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:community
    container_name: heritagegraph-neo4j
    environment:
      NEO4J_AUTH: neo4j/heritagegraph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data: