# Hugging Face QLoRA. Đổi model_id để nâng model; trainer không phụ thuộc tên Qwen.
# Qwen3.5-8B sẽ cần GPU nhiều VRAM hơn hoặc giảm max_seq_length/batch_size.
model_id: Qwen/Qwen2.5-3B-Instruct
train_file: data/train.jsonl
valid_file: data/valid.jsonl
output_dir: models/peft-adapter
seed: 42

max_seq_length: 1536
num_train_epochs: 3
batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
# PEFT tự tìm mọi linear layer, không hardcode q_proj/v_proj của một đời Qwen.
target_modules: all-linear

quant_type: nf4
double_quant: true
compute_dtype: auto
optimizer: paged_adamw_8bit
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.08
max_grad_norm: 1.0

logging_steps: 10
eval_steps: 25
save_steps: 25
save_total_limit: 3
report_to: none
