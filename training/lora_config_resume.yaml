# TỰ SINH bởi training/setup_resume.py - đừng sửa tay, sửa lora_config.yaml.
model: mlx-community/Qwen2.5-3B-Instruct-4bit
train: true
data: ./data
adapter_path: ./models/lora-adapter
seed: 42
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
mask_prompt: true
iters: 200
batch_size: 2
grad_accumulation_steps: 4
max_seq_length: 1536
grad_checkpoint: true
optimizer: adam
lr_schedule:
  name: cosine_decay
  warmup: 20
  warmup_init: 1.0e-06
  arguments:
  - 5.0e-05
  - 180
  - 1.0e-05
steps_per_report: 10
steps_per_eval: 50
val_batches: -1
save_every: 100
resume_adapter_file: models/lora-adapter/0001000_adapters.safetensors
